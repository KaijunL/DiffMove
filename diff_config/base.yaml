#type: args

diffusion:
  layers: 4 #original 4
  channels: 128 #original 64
  nheads: 8 #original 8
  diffusion_embedding_dim: 128 #original 128
  beta_start: 0.0001
  beta_end: 0.5 #original 0.5
  num_steps: 50 #original 50
  schedule: "quad" 


model:
  is_unconditional: False
  timeemb: 128 #original 128
  featureemb: 16
  target_strategy: "random"
  dropout_p: 0.0
  logits_mode: 3
  use_current_sample_for_train_celoss: True
  use_loss_weight: False
  use_noise_predictor: False
